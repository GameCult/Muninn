[workspace]
members = [
    "crates/muninn-daemon",
    "crates/muninn-move-tracker",
    "crates/muninn-psmoveapi-tracker",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# Local only, deliberately uncommitted. Unifies odin-core and this crate on one
# CultLib checkout so the diamond described in 1073ae6 does not bite locally.
# Delete once Odin's CultLib pin has moved. Points at the main checkout, which
# is on CultLib main.
[patch."https://github.com/GameCult/CultLib.git"]
cultnet-rs = { path = "../CultLib/packages/cultnet-rs" }
cultmesh-rs = { path = "../CultLib/packages/cultmesh-rs" }
cultcache-rs = { path = "../CultLib/packages/cultcache-rs" }
