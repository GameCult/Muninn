[package]
name = "muninn-contracts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "muninn_contracts"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
cultcache-rs = { workspace = true }
cultmesh-rs = { workspace = true }
cultnet-rs = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rmp-serde = "1.3"
