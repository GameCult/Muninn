[package]
name = "sleipnir-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sleipnir"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cultmesh-rs = { workspace = true }
cultnet-rs = { workspace = true }
cultcache-rs = { workspace = true }
odin-core = { workspace = true }
rmp-serde = "1.3"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
vigem-client = "0.1.4"
